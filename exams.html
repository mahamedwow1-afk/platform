<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Sentry | الاختبارات التفاعلية</title>
    <script src="js/auth.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#010308] sci-fi-grid text-slate-100 min-h-screen flex flex-col antialiased relative selection:bg-cyan-500 selection:text-slate-950">
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden md:hidden"></div>
    <div class="flex-1 flex flex-row min-h-screen">
        <aside id="sidebar" class="fixed md:static inset-y-0 right-0 z-50 w-64 bg-slate-900/95 border-l border-slate-800/80 flex flex-col justify-between transition-transform duration-300 transform translate-x-full md:translate-x-0"></aside>
        <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
            <header class="h-16 bg-slate-900/60 backdrop-blur-md border-b border-slate-800/80 px-6 flex items-center justify-between sticky top-0 z-30">
                <div class="flex items-center gap-3">
                    <button type="button" id="sidebar-toggle" class="md:hidden w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center text-slate-300"><i class="fas fa-bars text-sm"></i></button>
                    <h1 class="text-base font-bold text-slate-100">الاختبارات التفاعلية</h1>
                </div>
                <div class="relative">
                    <button type="button" id="notif-trigger" class="w-9 h-9 rounded-xl bg-slate-800/80 border border-slate-700/60 flex items-center justify-center text-slate-300 hover:text-emerald-400 relative">
                        <i class="far fa-bell text-sm"></i>
                        <span id="notif-badge" class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-emerald-500 text-[9px] font-bold text-slate-950 flex items-center justify-center border-2 border-slate-900 hidden">0</span>
                    </button>
                    <div id="notif-dropdown" class="absolute left-0 mt-2 w-80 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl z-50 hidden overflow-hidden">
                        <div class="p-3 border-b border-slate-800 flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-200">الإشعارات</span>
                            <button type="button" id="mark-all-read" class="text-[10px] text-emerald-400 hover:underline">تحديد كمقروء</button>
                        </div>
                        <div id="notif-list" class="max-h-64 overflow-y-auto"></div>
                    </div>
                </div>
            </header>
            <div id="exams-root" class="p-6 max-w-7xl w-full mx-auto">
                <section id="exams-selection-view">
                    <h2 class="text-lg font-black mb-4">الاختبارات المتاحة</h2>
                    <div id="available-exams-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </section>
                <section id="active-exam-view" class="hidden space-y-4">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 glass-panel rounded-2xl p-5 border border-slate-800">
                        <div>
                            <p id="exam-active-unit" class="text-xs text-emerald-400 font-bold"></p>
                            <h2 id="exam-active-title" class="text-xl font-black"></h2>
                            <p class="text-xs text-slate-400 mt-1">سؤال <span id="exam-q-current">1</span> من <span id="exam-q-total">0</span></p>
                        </div>
                        <div id="exam-timer-container" class="px-4 py-2 rounded-xl border border-slate-700 bg-slate-900 font-bold text-cyan-300">
                            <i class="far fa-clock ml-1"></i>
                            <span id="exam-timer-display">00:00</span>
                        </div>
                    </div>
                    <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                        <div id="exam-progress-bar" class="bg-emerald-500 h-2 rounded-full transition-all" style="width: 0%"></div>
                    </div>
                    <div class="glass-panel rounded-2xl p-6 border border-slate-800">
                        <h3 id="exam-q-text" class="text-base font-bold mb-4 leading-relaxed"></h3>
                        <div id="exam-options-container" class="space-y-3"></div>
                    </div>
                    <div class="flex items-center justify-between gap-3 flex-wrap">
                        <button type="button" id="exam-btn-prev" onclick="prevQuestion()" class="px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-xs font-bold disabled:opacity-40">السابق</button>
                        <div id="exam-questions-palette" class="flex flex-wrap gap-2"></div>
                        <button type="button" id="exam-btn-next" onclick="nextQuestion()" class="px-4 py-2 rounded-xl bg-emerald-500 text-slate-950 text-xs font-bold">التالي</button>
                        <button type="button" id="exam-btn-submit" onclick="submitExam()" class="hidden px-4 py-2 rounded-xl bg-cyan-500 text-slate-950 text-xs font-bold">تسليم الاختبار</button>
                    </div>
                </section>
                <section id="exam-results-view" class="hidden space-y-4">
                    <div class="glass-panel rounded-2xl p-6 border border-slate-800 text-center">
                        <div id="result-score-percent" class="text-4xl font-black text-emerald-400 mb-1">0%</div>
                        <div id="result-score-fraction" class="text-sm text-slate-400 mb-3">0 من 0</div>
                        <h2 id="result-status-title" class="text-xl font-bold mb-1"></h2>
                        <p id="result-status-desc" class="text-sm text-slate-400"></p>
                        <button type="button" onclick="backToExamsList()" class="mt-4 px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-xs font-bold">العودة لقائمة الاختبارات</button>
                    </div>
                    <div id="exam-questions-review"></div>
                </section>
            </div>
        </main>
    </div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/components.js"></script>
    <script src="js/exams.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            UI.renderSidebar("exams.html");
            initSidebar();
            initHeaderProfile();
        });
    </script>
</body>
</html>
