<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Sentry | تفاصيل ومحاضرات الكورس</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#010308] text-slate-100 min-h-screen font-sans antialiased">
    
    <div class="max-w-4xl mx-auto p-4 sm:p-8">
        <!-- زر العودة -->
        <a href="courses.html" class="text-xs text-slate-400 hover:text-emerald-400 mb-6 inline-flex items-center gap-2 transition-colors">
            <i class="fas fa-arrow-right"></i> العودة لقائمة الكورسات
        </a>

        <!-- رأس الكورس -->
        <header id="course-header" class="mb-8 bg-slate-900 border border-slate-800 rounded-2xl p-6 relative overflow-hidden">
            <!-- سيتم تعبئته بواسطة الجافاسكريبت -->
        </header>

        <!-- قسم المحاضرات -->
        <div class="mb-4 flex items-center justify-between">
            <h2 class="text-xl font-bold text-slate-100 flex items-center gap-2">
                <i class="fas fa-list-ul text-emerald-400"></i> محتوى الكورس والمحاضرات
            </h2>
            <span id="lectures-count-badge" class="text-xs text-slate-400 font-medium">0 محاضرة</span>
        </div>

        <div id="lectures-container" class="space-y-4">
            <!-- سيتم تعبئته بواسطة الجافاسكريبت -->
        </div>
    </div>

    <!-- ملفات الجافاسكريبت -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/course-details.js"></script>
</body>
</html>
